<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Counter</title>
    <style>
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        margin: 0;
        padding: 16px;
        min-width: 200px;
        text-align: center;
      }
      h1 {
        font-size: 14px;
        font-weight: 600;
        margin: 0 0 12px;
        color: #444;
      }
      #count {
        font-size: 36px;
        font-weight: 700;
        margin: 8px 0 16px;
        font-variant-numeric: tabular-nums;
      }
      .row {
        display: flex;
        gap: 8px;
        justify-content: center;
      }
      button {
        flex: 1;
        padding: 8px 12px;
        font-size: 16px;
        border: 1px solid #ccc;
        border-radius: 4px;
        background: #f7f7f7;
        cursor: pointer;
      }
      button:hover {
        background: #eee;
      }
      button:active {
        background: #ddd;
      }
      #reset {
        margin-top: 8px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>Counter</h1>
    <div id="count">0</div>
    <div class="row">
      <button id="dec" type="button">−</button>
      <button id="inc" type="button">+</button>
    </div>
    <button id="reset" type="button">Reset</button>

    <script src="../storage.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
